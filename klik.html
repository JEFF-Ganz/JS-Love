<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE YOU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(-45deg, #1a0000, #2a0000, #0F0F0F, #1a0000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: floatHeart 6s ease-in infinite;
            opacity: 0.7;
        }
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        .text-container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        .love-text {
            font-size: 100px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF0000, #FF4D4D, #FF6B6B, #FFFFFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.9),
                         0 0 60px rgba(255, 0, 0, 0.7),
                         0 0 90px rgba(255, 77, 77, 0.5),
                         0 0 120px rgba(255, 107, 107, 0.3);
            animation: glow 2s ease-in-out infinite alternate, pulse 1.5s ease-in-out infinite;
        }
        @keyframes glow {
            from {
                text-shadow: 0 0 30px rgba(255, 0, 0, 0.9),
                             0 0 60px rgba(255, 0, 0, 0.7),
                             0 0 90px rgba(255, 77, 77, 0.5),
                             0 0 120px rgba(255, 107, 107, 0.3);
            }
            to {
                text-shadow: 0 0 50px rgba(255, 0, 0, 1),
                             0 0 100px rgba(255, 77, 77, 0.8),
                             0 0 150px rgba(255, 107, 107, 0.6),
                             0 0 200px rgba(255, 0, 0, 0.4);
            }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floating-hearts"></div>
    
    <div class="text-container">
        <p class="love-text">I LOVE YOU</p>
    </div>

    <script>
        // Animasi floating hearts
        function initFloatingHearts() {
            const container = document.getElementById('floating-hearts');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 7000);
            }, 500);
        }
        
        initFloatingHearts();
    </script>
</body>
</html>
